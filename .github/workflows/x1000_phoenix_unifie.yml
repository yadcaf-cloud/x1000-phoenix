name: X1000 PHOENIX - UNIFIE M1-M5

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: x1000-phoenix-main
  cancel-in-progress: false

jobs:
  phoenix:
    name: Collecte PMU - M1 M5 - PV FIGES AUDITS
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TZ: Europe/Paris
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    defaults:
      run:
        shell: bash

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer et verifier les programmes
        run: |
          set -euo pipefail
          python --version

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          for fichier in \
            phoenix.py \
            pmu_engine.py \
            analyser_moteurs.py \
            reparer_figes_audits.py \
            reparer_qualifications_audits.py \
            publication.py
          do
            if [ -f "$fichier" ]; then
              python -m py_compile "$fichier"
              echo "OK : $fichier"
            else
              echo "::warning::Absent : $fichier"
            fi
          done

          test -f pmu_engine.py || {
            echo "::error::Collecteur PMU absent"
            exit 1
          }

          mkdir -p data/figes data/pv \
            data/audits data/journaux

      - name: Inventorier les archives historiques
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("data")
          dossiers = {"figes", "pv", "audits", "journaux"}

          inventaire = {}

          for p in root.rglob("*.json"):
              if any(
                  partie in dossiers
                  for partie in p.relative_to(root).parts[:-1]
              ):
                  inventaire[str(p.relative_to(root))] = (
                      hashlib.sha256(p.read_bytes()).hexdigest()
                  )

          Path("/tmp/x1000-archives.json").write_text(
              json.dumps(inventaire, indent=2),
              encoding="utf-8"
          )

          print("Archives protegees :", len(inventaire))
          PY

      - name: Collecter les courses PMU
        id: collecte
        run: |
          set -euo pipefail

          # Eviter la reutilisation silencieuse
          # de fichiers de collecte precedents.
          rm -f data/collecte.json data/courses_pmu.json

          python pmu_engine.py

      - name: Qualifier les courses M1-M5
        id: qualifications
        run: |
          set -euo pipefail

          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from zoneinfo import ZoneInfo

          DATA = Path("data")
          PARIS = ZoneInfo("Europe/Paris")
          now = dt.datetime.now(PARIS)
          today = now.date().isoformat()

          MOTEURS = {
              "M1": ["performances", "distance", "terrain", "regularite"],
              "M2": ["forme", "jockey", "entraineur", "performances"],
              "M3": ["cote", "performances", "forme"],
              "M4": ["numero", "corde", "distance", "performances"],
              "M5": ["cote", "forme", "performances"],
          }

          ALIASES = {
              "performances": ["performances", "musique", "historique"],
              "distance": ["distance"],
              "terrain": ["terrain", "etat_terrain"],
              "regularite": ["regularite", "regularite_score"],
              "forme": ["forme", "forme_recente"],
              "jockey": ["jockey", "driver"],
              "entraineur": ["entraineur"],
              "cote": ["cote", "cote_direct", "rapport_probable"],
              "numero": ["numero", "numPmu"],
              "corde": ["corde", "place_corde"],
          }

          def sauver(nom, objet):
              chemin = DATA / nom
              chemin.write_text(
                  json.dumps(
                      objet,
                      ensure_ascii=False,
                      indent=2,
                      allow_nan=False
                  ) + "\n",
                  encoding="utf-8"
              )

          def disponible(objet, critere):
              if not isinstance(objet, dict):
                  return False

              for cle in ALIASES[critere]:
                  v = objet.get(cle)
                  if v is None or isinstance(v, bool):
                      continue
                  if isinstance(v, str) and v.strip():
                      return True
                  if isinstance(v, (list, dict)) and v:
                      return True
                  if isinstance(v, (int, float)):
                      return True
              return False

          def depart(course):
              valeur = course.get("depart")
              if not isinstance(valeur, str):
                  return None
              try:
                  d = dt.datetime.fromisoformat(
                      valeur.replace("Z", "+00:00")
                  )
                  if d.tzinfo is None:
                      d = d.replace(tzinfo=PARIS)
                  return d.astimezone(PARIS)
              except ValueError:
                  return None

          def qualifier(course, moteur):
              partants = course["partants"]
              criteres = MOTEURS[moteur]
              ok = []
              manque = []

              for critere in criteres:
                  couverture = sum(
                      disponible(p, critere)
                      or disponible(course, critere)
                      for p in partants
                  ) / len(partants)

                  if couverture >= 0.50:
                      ok.append(critere)
                  else:
                      manque.append(critere)

              score = round(100 * len(ok) / len(criteres))
              statut = (
                  "VERT" if score >= 50
                  else "JAUNE" if score >= 25
                  else "ROUGE"
              )

              return {
                  "moteur": moteur,
                  "score_donnees": score,
                  "qualification": statut,
                  "criteres_disponibles": ok,
                  "criteres_a_completer": manque,
              }

          erreurs = []
          courses = []
          source = None

          for nom in ("collecte.json", "courses_pmu.json"):
              chemin = DATA / nom
              if not chemin.is_file():
                  continue

              try:
                  objet = json.loads(
                      chemin.read_text(encoding="utf-8")
                  )
                  lignes = (
                      objet.get("courses")
                      if isinstance(objet, dict)
                      else objet
                  )
                  if isinstance(lignes, list):
                      courses = lignes
                      source = nom
                      break
              except (OSError, ValueError) as e:
                  erreurs.append(f"{nom}: {e}")

          if source is None:
              erreurs.append("Aucune collecte au format reconnu")

          valides = []
          exclusions = []
          deja_vus = set()

          for course in courses:
              if not isinstance(course, dict):
                  continue

              ident = course.get("id")
              d = depart(course)
              partants = course.get("partants")
              raisons = []

              if not ident:
                  raisons.append("Identifiant absent")
              if d is None:
                  raisons.append("Depart absent ou invalide")
              elif d.date() != now.date():
                  raisons.append("Hors programme du jour")

              if course.get("localisation_france_verifiee") is not True:
                  raisons.append("France non verifiee")

              if not isinstance(partants, list):
                  raisons.append("Partants absents")
              else:
                  partants = [
                      p for p in partants
                      if isinstance(p, dict)
                      and p.get("non_partant") is not True
                  ]
                  if len(partants) < 2:
                      raisons.append("Partants insuffisants")

              if raisons:
                  exclusions.append({
                      "id_course": ident,
                      "raisons": raisons,
                  })
                  continue

              if str(ident) in deja_vus:
                  continue

              deja_vus.add(str(ident))
              copie = dict(course)
              copie["partants"] = partants
              valides.append(copie)

          selections = {m: [] for m in MOTEURS}
          jaunes = []
          rouges = []

          for course in valides:
              d = depart(course)
              if d is None or d <= now:
                  continue

              for moteur in MOTEURS:
                  analyse = qualifier(course, moteur)
                  ligne = {
                      "id_course": course["id"],
                      "depart": d.isoformat(),
                      "hippodrome": course.get("hippodrome"),
                      "reunion": course.get("reunion"),
                      "numero_course": course.get("numero_course"),
                      "nombre_partants": len(course["partants"]),
                      "heure_verification": now.isoformat(),
                      **analyse,
                  }

                  statut = analyse["qualification"]
                  if statut == "VERT":
                      selections[moteur].append(ligne)
                  elif statut == "JAUNE":
                      jaunes.append(ligne)
                  else:
                      rouges.append(ligne)

          tableau = sorted(
              [
                  ligne
                  for lignes in selections.values()
                  for ligne in lignes
              ],
              key=lambda x: (x["depart"], x["moteur"])
          )

          for lignes in selections.values():
              lignes.sort(key=lambda x: x["depart"])

          jaunes.sort(key=lambda x: x["depart"])
          rouges.sort(key=lambda x: x["depart"])

          statut = "OK" if source and valides else "DEGRADE"

          diagnostic = {
              "systeme": "X1000 PHOENIX",
              "version": "7.0",
              "date": today,
              "mis_a_jour": now.isoformat(),
              "statut": statut,
              "collecte_executee": source is not None,
              "source_courses": source,
              "courses_collectees": len(courses),
              "courses_verifiees": len(valides),
              "courses_qualifiees": len(tableau),
              "qualifications_jaunes": len(jaunes),
              "qualifications_rouges": len(rouges),
              "exclusions_essentielles": exclusions,
              "erreurs": erreurs,
          }

          sauver("diagnostic_unifie.json", diagnostic)
          sauver("courses_verifiees.json", {
              "date": today,
              "mis_a_jour": now.isoformat(),
              "statut": statut,
              "courses": valides,
          })
          sauver("selection_courses_m1_m5.json", {
              "systeme": "X1000 PHOENIX",
              "version": "7.0",
              "date": today,
              "mise_a_jour": now.isoformat(),
              "statut": statut,
              "type": "preselection",
              "seuil_vert": 50,
              "seuil_jaune": 25,
              "moteurs": selections,
              "tableau_officiel": tableau,
              "courses_jaunes": jaunes,
              "courses_rouges": rouges,
              "exclusions_essentielles": exclusions,
              "pronostics_generes": False,
              "figes_modifies": False,
              "pari_valide": False,
          })

          print("Courses collectees :", len(courses))
          print("Courses verifiees :", len(valides))
          print("Qualifications vertes :", len(tableau))
          print("Qualifications jaunes :", len(jaunes))
          print("Qualifications rouges :", len(rouges))
          print("Exclusions :", len(exclusions))
          for erreur in erreurs:
              print("DIAGNOSTIC :", erreur)
          PY

      - name: Analyser les moteurs M1-M5
        id: analyses
        run: |
          set -euo pipefail

          if [ -f analyser_moteurs.py ]; then
            python analyser_moteurs.py
          else
            echo "::warning::Analyseur absent"
          fi

      - name: Reparer les FIGES PV et audits
        id: audits
        run: |
          set -euo pipefail

          if [ -f reparer_figes_audits.py ]; then
            python reparer_figes_audits.py
          else
            echo "::warning::Reparateur FIGES absent"
          fi

      - name: Reparer qualifications et diagnostics
        id: reparation
        run: |
          set -euo pipefail

          if [ -f reparer_qualifications_audits.py ]; then
            python reparer_qualifications_audits.py
          else
            echo "::warning::Reparateur qualifications absent"
          fi

          for fichier in \
            data/publication_qualifications.json \
            data/publication_diagnostic_audits.json
          do
            if [ -f "$fichier" ]; then
              python -m json.tool "$fichier" > /dev/null
              echo "JSON valide : $fichier"
            else
              echo "::warning::Publication absente : $fichier"
            fi
          done

      - name: Generer les publications
        id: publication
        run: |
          set -euo pipefail

          if [ -f publication.py ]; then
            python publication.py
          else
            echo "::warning::publication.py absent"
          fi

      - name: Verifier archives et JSON
        id: validation
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("data")
          inventaire = json.loads(
              Path("/tmp/x1000-archives.json")
              .read_text(encoding="utf-8")
          )

          for rel, attendu in inventaire.items():
              chemin = root / rel
              if not chemin.is_file():
                  raise SystemExit("Archive supprimee : " + rel)
              actuel = hashlib.sha256(
                  chemin.read_bytes()
              ).hexdigest()
              if actuel != attendu:
                  raise SystemExit("Archive modifiee : " + rel)

          fichiers = list(root.rglob("*.json"))
          for chemin in fichiers:
              with chemin.open(encoding="utf-8") as f:
                  json.load(f)

          requis = (
              "diagnostic_unifie.json",
              "courses_verifiees.json",
              "selection_courses_m1_m5.json",
          )

          for nom in requis:
              if not (root / nom).is_file():
                  raise SystemExit("JSON requis absent : " + nom)

          print("JSON valides :", len(fichiers))
          print("Archives protegees :", len(inventaire))
          PY

      - name: Publier les donnees sur GitHub
        id: github
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Publier les nouveaux JSON sans supprimer
          # les archives historiques.
          git add -f -- \
            data/diagnostic_unifie.json \
            data/courses_verifiees.json \
            data/selection_courses_m1_m5.json

          for fichier in \
            data/publication_courses.json \
            data/publication_pv.json \
            data/publication_figes.json \
            data/publication_audits.json \
            data/publication_rapport.json \
            data/publication_qualifications.json \
            data/publication_diagnostic_audits.json
          do
            if [ -f "$fichier" ]; then
              git add -f -- "$fichier"
            fi
          done

          if git diff --cached --quiet; then
            echo "Aucune modification a publier"
            exit 0
          fi

          git commit -m "X1000: actualisation unifiee M1-M5"

          # Conserver les modifications non indexees
          # hors du rebase.
          if [ -n "$(git status --porcelain)" ]; then
            git stash push -u \
              -m "X1000 temporaires"
          fi

          for tentative in 1 2 3 4 5; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Conflit Git detecte"
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Publication reussie"
              exit 0
            fi

            sleep $((tentative * 3))
          done

          echo "::error::Publication echouee"
          exit 1

      - name: Bilan final X1000 PHOENIX
        if: always()
        env:
          COLLECTE: ${{ steps.collecte.outcome }}
          QUALIFICATIONS: ${{ steps.qualifications.outcome }}
          ANALYSES: ${{ steps.analyses.outcome }}
          AUDITS: ${{ steps.audits.outcome }}
          REPARATION: ${{ steps.reparation.outcome }}
          PUBLICATION: ${{ steps.publication.outcome }}
          VALIDATION: ${{ steps.validation.outcome }}
          GITHUB: ${{ steps.github.outcome }}
        run: |
          {
            echo "## X1000 PHOENIX - BILAN M1-M5"
            echo ""
            echo "| Etape | Statut |"
            echo "|---|---|"
            echo "| Collecte PMU | $COLLECTE |"
            echo "| Qualifications | $QUALIFICATIONS |"
            echo "| Analyses M1-M5 | $ANALYSES |"
            echo "| FIGES PV audits | $AUDITS |"
            echo "| Reparation | $REPARATION |"
            echo "| Publications | $PUBLICATION |"
            echo "| Validation | $VALIDATION |"
            echo "| GitHub | $GITHUB |"
            echo ""
            echo "Heure Paris : $(TZ=Europe/Paris date)"
          } >> "$GITHUB_STEP_SUMMARY"
