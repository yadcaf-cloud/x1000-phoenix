name: X1000 PHOENIX - UNIFIE M1-M5

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: x1000-phoenix-unifie
  cancel-in-progress: false

jobs:
  phoenix:
    name: Collecte PMU et selection M1-M5
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TZ: Europe/Paris
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    defaults:
      run:
        shell: bash

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verifier les programmes
        run: |
          set -euo pipefail
          python --version
          test -f pmu_engine.py || {
            echo "::error::pmu_engine.py absent"
            exit 1
          }
          python -m py_compile pmu_engine.py

      - name: Collecter et selectionner les courses
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile
          from zoneinfo import ZoneInfo

          ROOT = pathlib.Path.cwd()
          DATA = ROOT / "data"
          DATA.mkdir(parents=True, exist_ok=True)

          PARIS = ZoneInfo("Europe/Paris")
          now = dt.datetime.now(PARIS)
          errors = []

          MOTEURS = {
              "M1": {
                  "nom": "Valeur et regularite",
                  "criteres": [
                      "performances",
                      "distance",
                      "terrain",
                      "regularite",
                  ],
              },
              "M2": {
                  "nom": "Forme et entourage",
                  "criteres": [
                      "forme",
                      "jockey",
                      "entraineur",
                      "performances",
                  ],
              },
              "M3": {
                  "nom": "Outsiders et faux favoris",
                  "criteres": [
                      "cote",
                      "performances",
                      "forme",
                  ],
              },
              "M4": {
                  "nom": "Tactique et combinaisons",
                  "criteres": [
                      "numero",
                      "corde",
                      "distance",
                      "performances",
                  ],
              },
              "M5": {
                  "nom": "Risques, cotes et paris",
                  "criteres": [
                      "cote",
                      "forme",
                      "performances",
                  ],
              },
          }

          ALIASES = {
              "performances": (
                  "performances",
                  "musique",
                  "historique",
              ),
              "distance": ("distance",),
              "terrain": (
                  "terrain",
                  "etat_terrain",
              ),
              "regularite": (
                  "regularite",
                  "regularite_score",
              ),
              "forme": (
                  "forme",
                  "forme_recente",
              ),
              "jockey": ("jockey", "driver"),
              "entraineur": ("entraineur",),
              "cote": (
                  "cote",
                  "cote_direct",
                  "rapport_probable",
              ),
              "numero": ("numero", "numPmu"),
              "corde": ("corde", "place_corde"),
          }

          def atomic(path, obj):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )
              tmp = None
              try:
                  with tempfile.NamedTemporaryFile(
                      mode="w",
                      encoding="utf-8",
                      dir=path.parent,
                      delete=False
                  ) as f:
                      tmp = pathlib.Path(f.name)
                      json.dump(
                          obj,
                          f,
                          ensure_ascii=False,
                          indent=2,
                          allow_nan=False
                      )
                      f.write("\n")
                      f.flush()
                      os.fsync(f.fileno())
                  os.replace(tmp, path)
              finally:
                  if tmp and tmp.exists():
                      tmp.unlink()

          def read(path):
              try:
                  return json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except (OSError, ValueError) as exc:
                  errors.append(
                      f"{path.name}: {exc}"
                  )
                  return None

          def present(obj, critere):
              if not isinstance(obj, dict):
                  return False

              for key in ALIASES[critere]:
                  val = obj.get(key)

                  if val is None or isinstance(val, bool):
                      continue

                  if isinstance(val, str):
                      if val.strip():
                          return True
                  elif isinstance(val, (list, dict)):
                      if val:
                          return True
                  else:
                      return True

              return False

          def depart_paris(course):
              val = course.get("depart")
              if not isinstance(val, str):
                  return None

              try:
                  instant = dt.datetime.fromisoformat(
                      val.replace("Z", "+00:00")
                  )

                  if instant.tzinfo is None:
                      instant = instant.replace(
                          tzinfo=PARIS
                      )

                  return instant.astimezone(PARIS)
              except ValueError:
                  return None

          def evaluer(course, moteur):
              criteres = MOTEURS[moteur]["criteres"]
              partants = course["partants"]
              points = 0

              for critere in criteres:
                  disponibles = sum(
                      present(p, critere)
                      or present(course, critere)
                      for p in partants
                  )

                  if disponibles / len(partants) >= 0.8:
                      points += 1

              score = round(
                  100 * points / len(criteres)
              )

              if score >= 75:
                  statut = "VERT"
              elif score >= 50:
                  statut = "JAUNE"
              else:
                  statut = "ROUGE"

              return score, statut

          # COLLECTE PMU
          collecte_ok = False
          script = ROOT / "pmu_engine.py"

          # Retirer les sorties anciennes pour
          # ne pas publier une collecte perimee.
          for filename in (
              "collecte.json",
              "courses_pmu.json",
          ):
              path = DATA / filename
              if path.is_file():
                  path.unlink()

          try:
              subprocess.run(
                  [sys.executable, str(script)],
                  cwd=ROOT,
                  check=True,
                  timeout=900
              )
              collecte_ok = True
          except (
              subprocess.CalledProcessError,
              subprocess.TimeoutExpired,
              OSError
          ) as exc:
              errors.append(f"Collecte PMU: {exc}")

          # LECTURE DE LA COLLECTE
          courses = []
          source = None

          if collecte_ok:
              for path in (
                  DATA / "collecte.json",
                  DATA / "courses_pmu.json",
              ):
                  if not path.is_file():
                      continue

                  obj = read(path)

                  if isinstance(obj, dict):
                      lignes = obj.get("courses")
                  elif isinstance(obj, list):
                      lignes = obj
                  else:
                      lignes = None

                  if isinstance(lignes, list):
                      courses = lignes
                      source = path
                      break

          # VALIDATION DES COURSES
          valides = []
          deja_vus = set()

          for course in courses:
              if not isinstance(course, dict):
                  continue

              ident = course.get("id")
              depart = depart_paris(course)
              partants = course.get("partants")

              if not ident or depart is None:
                  continue

              if depart.date() != now.date():
                  continue

              if not isinstance(partants, list):
                  continue

              if len(partants) < 2:
                  continue

              if (
                  course.get(
                      "localisation_france_verifiee"
                  ) is not True
              ):
                  continue

              if str(ident) in deja_vus:
                  continue

              deja_vus.add(str(ident))
              valides.append(course)

          # SELECTION INDEPENDANTE M1-M5
          selections = {
              moteur: [] for moteur in MOTEURS
          }
          exclusions = []

          for course in valides:
              depart = depart_paris(course)

              if depart <= now:
                  continue

              partants = [
                  p for p in course["partants"]
                  if isinstance(p, dict)
              ]

              if len(partants) < 2:
                  continue

              course = dict(course)
              course["partants"] = partants

              for moteur in MOTEURS:
                  score, statut = evaluer(
                      course,
                      moteur
                  )

                  ligne = {
                      "id_course": course["id"],
                      "depart": depart.isoformat(),
                      "hippodrome": course.get(
                          "hippodrome"
                      ),
                      "nombre_partants": len(partants),
                      "moteur": moteur,
                      "specialite": MOTEURS[moteur]["nom"],
                      "score_donnees": score,
                      "qualification": statut,
                  }

                  if statut == "VERT":
                      selections[moteur].append(ligne)
                  else:
                      exclusions.append(ligne)

          for moteur in selections:
              selections[moteur].sort(
                  key=lambda c: (
                      c["depart"],
                      -c["score_donnees"]
                  )
              )

          # DIAGNOSTIC
          status = (
              "OK" if collecte_ok and valides
              else "DEGRADE"
          )

          if not valides:
              errors.append(
                  "Aucune course francaise verifiee."
              )

          atomic(
              DATA / "diagnostic_unifie.json",
              {
                  "version": "4.0",
                  "date": now.date().isoformat(),
                  "mis_a_jour": now.isoformat(),
                  "statut": status,
                  "collecte_executee": collecte_ok,
                  "source_courses": (
                      str(source.relative_to(ROOT))
                      if source else None
                  ),
                  "courses_verifiees": len(valides),
                  "erreurs": errors,
                  "note": (
                      "Aucun pronostic, FIGE ou "
                      "resultat invente."
                  ),
              }
          )

          # PUBLICATION DES COURSES
          atomic(
              DATA / "courses_verifiees.json",
              {
                  "date": now.date().isoformat(),
                  "mis_a_jour": now.isoformat(),
                  "statut": status,
                  "courses": valides,
              }
          )

          # PUBLICATION DES SELECTIONS
          atomic(
              DATA / "selection_courses_m1_m5.json",
              {
                  "systeme": "X1000 PHOENIX",
                  "version": "4.0",
                  "date": now.date().isoformat(),
                  "mise_a_jour": now.isoformat(),
                  "statut": status,
                  "type": "preselection",
                  "moteurs": selections,
                  "courses_non_retenues": exclusions,
                  "pronostics_generes": False,
                  "figes_modifies": False,
                  "note": (
                      "VERT = donnees suffisantes "
                      "pour analyse approfondie. "
                      "Aucun gain garanti."
                  ),
              }
          )

          print("=" * 50)
          print("X1000 PHOENIX - UNIFIE M1-M5")
          print("Date :", now.isoformat())
          print("Statut :", status)
          print("Courses verifiees :", len(valides))

          for moteur, lignes in selections.items():
              print(
                  moteur,
                  MOTEURS[moteur]["nom"],
                  ":",
                  len(lignes),
                  "courses vertes"
              )

          for erreur in errors:
              print("DIAGNOSTIC:", erreur)

          print("=" * 50)
          PY

      - name: Publier les donnees sur main
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f -- \
            data/diagnostic_unifie.json \
            data/courses_verifiees.json \
            data/selection_courses_m1_m5.json

          if git diff --cached --quiet; then
            echo "Aucune modification"
            exit 0
          fi

          git commit \
            -m "X1000: collecte et selection M1-M5"

          # Eviter les modifications non indexees
          # qui bloquent git rebase.
          if [ -n "$(git status --porcelain)" ]; then
            git stash push -u \
              -m "X1000 temporaire"
          fi

          # Publication sans force.
          for i in 1 2 3 4 5; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Conflit Git detecte"
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Publication X1000 reussie"
              exit 0
            fi

            echo "Nouvelle tentative $i"
            sleep $((i * 3))
          done

          echo "::error::Echec de publication"
          exit 1

      - name: Rapport final
        if: always()
        run: |
          echo "=================================="
          echo "X1000 PHOENIX - RAPPORT FINAL"
          echo "=================================="
          echo "Date Paris : $(TZ=Europe/Paris date)"
          echo "Depot : $GITHUB_REPOSITORY"
          echo "Branche : main"
          echo "Execution : $GITHUB_RUN_ID"
          echo "=================================="
