name: X1000 PHOENIX - UNIFIE M1-M5

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: x1000-phoenix-unifie
  cancel-in-progress: false

jobs:
  phoenix:
    name: Collecte PMU et selection souple M1-M5
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TZ: Europe/Paris
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    defaults:
      run:
        shell: bash

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verifier le collecteur PMU
        run: |
          set -euo pipefail
          python --version

          if [ ! -f pmu_engine.py ]; then
            echo "::error::pmu_engine.py absent"
            exit 1
          fi

          python -m py_compile pmu_engine.py

      - name: Collecter et qualifier les courses
        run: |
          set -euo pipefail

          python - <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from zoneinfo import ZoneInfo

          ROOT = Path.cwd()
          DATA = ROOT / "data"
          DATA.mkdir(parents=True, exist_ok=True)

          PARIS = ZoneInfo("Europe/Paris")
          now = dt.datetime.now(PARIS)
          today = now.date().isoformat()

          # Controle souple sur les criteres
          # secondaires, strict sur les
          # informations essentielles.
          SEUIL_VERT = 50
          SEUIL_JAUNE = 25
          COUVERTURE_CRITERE = 0.50

          MOTEURS = {
              "M1": {
                  "nom": "Valeur et regularite",
                  "criteres": [
                      "performances",
                      "distance",
                      "terrain",
                      "regularite",
                  ],
              },
              "M2": {
                  "nom": "Forme et entourage",
                  "criteres": [
                      "forme",
                      "jockey",
                      "entraineur",
                      "performances",
                  ],
              },
              "M3": {
                  "nom": "Outsiders et faux favoris",
                  "criteres": [
                      "cote",
                      "performances",
                      "forme",
                  ],
              },
              "M4": {
                  "nom": "Tactique et combinaisons",
                  "criteres": [
                      "numero",
                      "corde",
                      "distance",
                      "performances",
                  ],
              },
              "M5": {
                  "nom": "Risques, cotes et paris",
                  "criteres": [
                      "cote",
                      "forme",
                      "performances",
                  ],
              },
          }

          ALIASES = {
              "performances": (
                  "performances",
                  "musique",
                  "historique",
              ),
              "distance": ("distance",),
              "terrain": (
                  "terrain",
                  "etat_terrain",
              ),
              "regularite": (
                  "regularite",
                  "regularite_score",
              ),
              "forme": (
                  "forme",
                  "forme_recente",
              ),
              "jockey": ("jockey", "driver"),
              "entraineur": ("entraineur",),
              "cote": (
                  "cote",
                  "cote_direct",
                  "rapport_probable",
              ),
              "numero": ("numero", "numPmu"),
              "corde": ("corde", "place_corde"),
          }

          erreurs = []

          def ecrire(path, objet):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              temporaire = None

              try:
                  with tempfile.NamedTemporaryFile(
                      mode="w",
                      encoding="utf-8",
                      dir=path.parent,
                      delete=False
                  ) as fichier:
                      temporaire = Path(fichier.name)

                      json.dump(
                          objet,
                          fichier,
                          ensure_ascii=False,
                          indent=2,
                          allow_nan=False
                      )

                      fichier.write("\n")
                      fichier.flush()
                      os.fsync(fichier.fileno())

                  os.replace(temporaire, path)

              finally:
                  if (
                      temporaire is not None
                      and temporaire.exists()
                  ):
                      temporaire.unlink()

          def lire(path):
              try:
                  return json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

              except (OSError, ValueError) as exc:
                  erreurs.append(
                      f"{path.name}: {exc}"
                  )
                  return None

          def present(objet, critere):
              if not isinstance(objet, dict):
                  return False

              for cle in ALIASES[critere]:
                  valeur = objet.get(cle)

                  if valeur is None:
                      continue

                  if isinstance(valeur, bool):
                      continue

                  if isinstance(valeur, str):
                      if valeur.strip():
                          return True

                  elif isinstance(valeur, (list, dict)):
                      if valeur:
                          return True

                  else:
                      return True

              return False

          def depart_paris(course):
              valeur = course.get("depart")

              if not isinstance(valeur, str):
                  return None

              try:
                  instant = dt.datetime.fromisoformat(
                      valeur.replace("Z", "+00:00")
                  )

                  if instant.tzinfo is None:
                      # Le collecteur doit fournir
                      # l'heure locale de Paris.
                      instant = instant.replace(
                          tzinfo=PARIS
                      )

                  return instant.astimezone(PARIS)

              except ValueError:
                  return None

          def qualifier(course, moteur):
              criteres = MOTEURS[moteur]["criteres"]
              partants = course["partants"]

              disponibles = []
              manquants = []

              for critere in criteres:
                  nombre = sum(
                      present(partant, critere)
                      or present(course, critere)
                      for partant in partants
                  )

                  couverture = nombre / len(partants)

                  if couverture >= COUVERTURE_CRITERE:
                      disponibles.append(critere)
                  else:
                      manquants.append(critere)

              score = round(
                  100 * len(disponibles)
                  / len(criteres)
              )

              if score >= SEUIL_VERT:
                  statut = "VERT"
              elif score >= SEUIL_JAUNE:
                  statut = "JAUNE"
              else:
                  statut = "ROUGE"

              return {
                  "moteur": moteur,
                  "specialite": MOTEURS[moteur]["nom"],
                  "score_donnees": score,
                  "qualification": statut,
                  "criteres_disponibles": disponibles,
                  "criteres_a_completer": manquants,
              }

          # 1. COLLECTE PMU
          collecte_ok = False
          script = ROOT / "pmu_engine.py"

          # Eviter de relire les anciens fichiers
          # comme s'ils venaient d'etre collectes.
          for nom in (
              "collecte.json",
              "courses_pmu.json",
          ):
              path = DATA / nom

              if path.is_file():
                  path.unlink()

          try:
              subprocess.run(
                  [sys.executable, str(script)],
                  cwd=ROOT,
                  check=True,
                  timeout=900
              )

              collecte_ok = True

          except (
              subprocess.CalledProcessError,
              subprocess.TimeoutExpired,
              OSError
          ) as exc:
              erreurs.append(
                  f"Collecte PMU: {exc}"
              )

          # 2. CHARGEMENT DES COURSES
          courses = []
          source = None

          if collecte_ok:
              for path in (
                  DATA / "collecte.json",
                  DATA / "courses_pmu.json",
              ):
                  if not path.is_file():
                      continue

                  objet = lire(path)

                  if isinstance(objet, dict):
                      lignes = objet.get("courses")

                  elif isinstance(objet, list):
                      lignes = objet

                  else:
                      lignes = None

                  if isinstance(lignes, list):
                      courses = lignes
                      source = path
                      break

          # 3. VERIFICATION ESSENTIELLE
          valides = []
          exclusions_essentielles = []
          identifiants = set()

          for course in courses:
              if not isinstance(course, dict):
                  continue

              ident = course.get("id")
              depart = depart_paris(course)
              partants = course.get("partants")

              raisons = []

              if not ident:
                  raisons.append(
                      "Identifiant absent"
                  )

              if depart is None:
                  raisons.append(
                      "Depart non verifiable"
                  )

              elif depart.date().isoformat() != today:
                  raisons.append(
                      "Course hors programme du jour"
                  )

              if (
                  course.get(
                      "localisation_france_verifiee"
                  ) is not True
              ):
                  raisons.append(
                      "Localisation France non verifiee"
                  )

              if not isinstance(partants, list):
                  raisons.append(
                      "Partants absents"
                  )

              elif len(partants) < 2:
                  raisons.append(
                      "Partants insuffisants"
                  )

              if raisons:
                  exclusions_essentielles.append({
                      "id_course": ident,
                      "raisons": raisons,
                  })
                  continue

              if str(ident) in identifiants:
                  continue

              identifiants.add(str(ident))
              valides.append(course)

          # 4. QUALIFICATION AUTONOME M1-M5
          selections = {
              moteur: []
              for moteur in MOTEURS
          }

          jaunes = []
          rouges = []

          for course in valides:
              depart = depart_paris(course)

              if depart <= now:
                  continue

              partants = [
                  p for p in course["partants"]
                  if isinstance(p, dict)
              ]

              if len(partants) < 2:
                  continue

              course = dict(course)
              course["partants"] = partants

              for moteur in MOTEURS:
                  analyse = qualifier(
                      course,
                      moteur
                  )

                  ligne = {
                      "id_course": course["id"],
                      "depart": depart.isoformat(),
                      "hippodrome": course.get(
                          "hippodrome"
                      ),
                      "reunion": course.get(
                          "reunion"
                      ),
                      "numero_course": course.get(
                          "numero_course"
                      ),
                      "nombre_partants": len(partants),
                      "heure_verification": (
                          now.isoformat()
                      ),
                      **analyse,
                  }

                  if analyse["qualification"] == "VERT":
                      selections[moteur].append(ligne)

                  elif analyse["qualification"] == "JAUNE":
                      jaunes.append(ligne)

                  else:
                      rouges.append(ligne)

          # 5. TRI CHRONOLOGIQUE
          for moteur in selections:
              selections[moteur].sort(
                  key=lambda ligne: (
                      ligne["depart"],
                      -ligne["score_donnees"]
                  )
              )

          jaunes.sort(
              key=lambda ligne: ligne["depart"]
          )

          # 6. TABLEAU DES COURSES QUALIFIEES
          tableau = []

          for lignes in selections.values():
              tableau.extend(lignes)

          tableau.sort(
              key=lambda ligne: (
                  ligne["depart"],
                  ligne["moteur"]
              )
          )

          statut = (
              "OK"
              if collecte_ok and valides
              else "DEGRADE"
          )

          if not valides:
              erreurs.append(
                  "Aucune course francaise verifiee"
              )

          # 7. DIAGNOSTIC
          ecrire(
              DATA / "diagnostic_unifie.json",
              {
                  "systeme": "X1000 PHOENIX",
                  "version": "6.0",
                  "date": today,
                  "mis_a_jour": now.isoformat(),
                  "statut": statut,
                  "collecte_executee": collecte_ok,
                  "source_courses": (
                      str(source.relative_to(ROOT))
                      if source else None
                  ),
                  "courses_verifiees": len(valides),
                  "seuil_vert": SEUIL_VERT,
                  "seuil_jaune": SEUIL_JAUNE,
                  "erreurs": erreurs,
                  "note": (
                      "Controle robuste sur les "
                      "donnees essentielles et souple "
                      "sur les criteres secondaires."
                  ),
              }
          )

          # 8. COURSES VERIFIEES
          ecrire(
              DATA / "courses_verifiees.json",
              {
                  "date": today,
                  "mis_a_jour": now.isoformat(),
                  "statut": statut,
                  "courses": valides,
              }
          )

          # 9. PRESELECTION M1-M5
          ecrire(
              DATA / "selection_courses_m1_m5.json",
              {
                  "systeme": "X1000 PHOENIX",
                  "version": "6.0",
                  "date": today,
                  "mise_a_jour": now.isoformat(),
                  "statut": statut,
                  "type": "preselection",
                  "devise": (
                      "Controle robuste, mais jamais "
                      "excessivement severe."
                  ),
                  "seuil_vert": SEUIL_VERT,
                  "seuil_jaune": SEUIL_JAUNE,
                  "moteurs": selections,
                  "tableau_officiel": tableau,
                  "courses_jaunes": jaunes,
                  "courses_rouges": rouges,
                  "exclusions_essentielles": (
                      exclusions_essentielles
                  ),
                  "pronostics_generes": False,
                  "figes_modifies": False,
                  "pari_valide": False,
                  "note": (
                      "VERT signifie admissible "
                      "a une analyse approfondie. "
                      "Ce n'est ni un pronostic "
                      "ni une garantie de gain."
                  ),
              }
          )

          # 10. JOURNAL D'EXECUTION
          print("=" * 55)
          print("X1000 PHOENIX - UNIFIE M1-M5")
          print("=" * 55)
          print("Heure Paris :", now.isoformat())
          print("Statut :", statut)
          print("Courses verifiees :", len(valides))
          print("Seuil VERT :", SEUIL_VERT)
          print("Seuil JAUNE :", SEUIL_JAUNE)

          for moteur, lignes in selections.items():
              print(
                  moteur,
                  MOTEURS[moteur]["nom"],
                  ":",
                  len(lignes),
                  "qualifications vertes"
              )

          print(
              "Qualifications jaunes :",
              len(jaunes)
          )
          print(
              "Qualifications rouges :",
              len(rouges)
          )

          for erreur in erreurs:
              print("DIAGNOSTIC :", erreur)

          print("Aucun FIGE historique modifie.")
          print("Aucun pronostic invente.")
          print("=" * 55)
          PY

      - name: Publier les donnees sur main
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f -- \
            data/diagnostic_unifie.json \
            data/courses_verifiees.json \
            data/selection_courses_m1_m5.json

          if git diff --cached --quiet; then
            echo "Aucune modification a publier"
            exit 0
          fi

          git commit -m \
            "X1000: selection souple M1-M5"

          # Mettre de cote les autres modifications
          # pour eviter l'erreur git rebase 128.
          if [ -n "$(git status --porcelain)" ]; then
            git stash push -u \
              -m "X1000 fichiers temporaires"
          fi

          # Publication sans force push.
          for i in 1 2 3 4 5; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Conflit Git detecte"
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Publication X1000 reussie"
              exit 0
            fi

            echo "Nouvelle tentative $i"
            sleep $((i * 3))
          done

          echo "::error::Echec de publication"
          exit 1

      - name: Rapport final
        if: always()
        run: |
          echo "=================================="
          echo "X1000 PHOENIX - RAPPORT FINAL"
          echo "=================================="
          echo "Date Paris : $(TZ=Europe/Paris date)"
          echo "Depot : $GITHUB_REPOSITORY"
          echo "Branche : main"
          echo "Execution : $GITHUB_RUN_ID"
          echo "=================================="
