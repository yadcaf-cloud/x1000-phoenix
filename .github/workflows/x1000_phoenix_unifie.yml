name: X1000 PHOENIX - UNIFIE

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: x1000-phoenix-unifie
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecter et publier sans inventer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile
          from zoneinfo import ZoneInfo

          ROOT = pathlib.Path.cwd()
          DATA = ROOT / "data"
          DATA.mkdir(exist_ok=True)

          PARIS = ZoneInfo("Europe/Paris")
          now = dt.datetime.now(PARIS)
          errors = []

          def atomic(path, obj):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )
              with tempfile.NamedTemporaryFile(
                  "w",
                  encoding="utf-8",
                  dir=path.parent,
                  delete=False
              ) as f:
                  json.dump(
                      obj,
                      f,
                      ensure_ascii=False,
                      indent=2,
                      allow_nan=False
                  )
                  f.write("\n")
                  tmp = f.name
              os.replace(tmp, path)

          def read(path):
              try:
                  return json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )
              except (OSError, ValueError) as exc:
                  errors.append(
                      f"{path}: {exc}"
                  )
                  return None

          def run(script):
              if not (ROOT / script).is_file():
                  errors.append(
                      f"Programme absent: {script}"
                  )
                  return False

              try:
                  subprocess.run(
                      [sys.executable, script],
                      cwd=ROOT,
                      check=True,
                      timeout=900
                  )
                  return True

              except (
                  subprocess.CalledProcessError,
                  subprocess.TimeoutExpired
              ) as exc:
                  errors.append(
                      f"{script}: {exc}"
                  )
                  return False

          collecte_ok = run("pmu_engine.py")

          courses = []
          source_path = DATA / "courses_pmu.json"

          for candidate in (
              DATA / "collecte.json",
          ):
              if not candidate.exists():
                  continue

              obj = read(candidate)

              if (
                  isinstance(obj, dict)
                  and isinstance(
                      obj.get("courses"), list
                  )
              ):
                  courses = obj["courses"]
                  source_path = candidate
                  break

              if isinstance(obj, list):
                  courses = obj
                  source_path = candidate
                  break

          valid = []

          for c in courses:
              if not isinstance(c, dict):
                  continue

              if not isinstance(
                  c.get("partants"), list
              ):
                  continue

              if not c.get("id"):
                  continue

              if not c.get("depart"):
                  continue

              if (
                  c.get(
                      "localisation_france_verifiee"
                  ) is not True
              ):
                  continue

              valid.append(c)

          status = (
              "OK"
              if collecte_ok and valid
              else "DEGRADE"
          )

          if not valid:
              errors.append(
                  "Aucune course francaise "
                  "verifiee et exploitable."
              )

          atomic(
              DATA / "diagnostic_unifie.json",
              {
                  "version": "1.0",
                  "date": now.date().isoformat(),
                  "mis_a_jour": now.isoformat(),
                  "statut": status,
                  "collecte_executee": collecte_ok,
                  "source_courses": (
                      str(source_path.relative_to(ROOT))
                      if source_path.exists()
                      else None
                  ),
                  "courses_verifiees": len(valid),
                  "erreurs": errors,
                  "note": (
                      "Aucun pronostic ni resultat "
                      "cree artificiellement."
                  )
              }
          )

          if collecte_ok and valid:
              atomic(
                  DATA / "courses_verifiees.json",
                  {
                      "date": now.date().isoformat(),
                      "mis_a_jour": now.isoformat(),
                      "statut": status,
                      "courses": valid
                  }
              )

          print(
              f"X1000 PHOENIX : {status} ; "
              f"courses verifiees : {len(valid)}"
          )

          for error in errors:
              print("DIAGNOSTIC:", error)
          PY

      - name: Publier les donnees sur main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/diagnostic_unifie.json

          if test -f data/courses_verifiees.json; then
            git add data/courses_verifiees.json
          fi

          if git diff --cached --quiet; then
            echo "Aucune modification"
            exit 0
          fi

          git commit -m "X1000: actualisation des donnees verifiees"

          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i * 3))
          done

          exit 1
