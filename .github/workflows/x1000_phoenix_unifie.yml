name: X1000 PHOENIX - UNIFIE

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: x1000-phoenix-unifie
  cancel-in-progress: false

jobs:
  collecte:
    name: Collecte PMU et publication
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TZ: Europe/Paris
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    defaults:
      run:
        shell: bash

    steps:

      - name: Recuperer le depot
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verifier Python et les programmes
        run: |
          set -euo pipefail

          python --version

          if [ ! -f pmu_engine.py ]; then
            echo "::error::pmu_engine.py absent"
            exit 1
          fi

          python -m py_compile pmu_engine.py

      - name: Collecter et verifier les donnees PMU
        run: |
          set -euo pipefail

          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile
          from zoneinfo import ZoneInfo

          ROOT = pathlib.Path.cwd()
          DATA = ROOT / "data"
          DATA.mkdir(parents=True, exist_ok=True)

          PARIS = ZoneInfo("Europe/Paris")
          now = dt.datetime.now(PARIS)
          errors = []

          def atomic(path, obj):
              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              tmp = None

              try:
                  with tempfile.NamedTemporaryFile(
                      mode="w",
                      encoding="utf-8",
                      dir=path.parent,
                      delete=False
                  ) as f:
                      tmp = pathlib.Path(f.name)

                      json.dump(
                          obj,
                          f,
                          ensure_ascii=False,
                          indent=2,
                          allow_nan=False
                      )

                      f.write("\n")
                      f.flush()
                      os.fsync(f.fileno())

                  os.replace(tmp, path)

              finally:
                  if tmp and tmp.exists():
                      tmp.unlink()

          def read(path):
              try:
                  return json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )

              except (OSError, ValueError) as exc:
                  errors.append(
                      f"{path.name}: {exc}"
                  )
                  return None

          def run(script):
              path = ROOT / script

              if not path.is_file():
                  errors.append(
                      f"Programme absent: {script}"
                  )
                  return False

              try:
                  subprocess.run(
                      [sys.executable, script],
                      cwd=ROOT,
                      check=True,
                      timeout=900
                  )
                  return True

              except (
                  subprocess.CalledProcessError,
                  subprocess.TimeoutExpired
              ) as exc:
                  errors.append(
                      f"{script}: {exc}"
                  )
                  return False

          collecte_ok = run("pmu_engine.py")

          courses = []
          source_path = None

          candidates = (
              DATA / "collecte.json",
              DATA / "courses_pmu.json",
          )

          if collecte_ok:
              for candidate in candidates:
                  if not candidate.is_file():
                      continue

                  # Eviter une ancienne collecte.
                  mtime = dt.datetime.fromtimestamp(
                      candidate.stat().st_mtime,
                      PARIS
                  )

                  if mtime.date() != now.date():
                      errors.append(
                          f"Collecte ancienne: {candidate.name}"
                      )
                      continue

                  obj = read(candidate)

                  if isinstance(obj, dict):
                      items = obj.get("courses")

                  elif isinstance(obj, list):
                      items = obj

                  else:
                      items = None

                  if isinstance(items, list):
                      courses = items
                      source_path = candidate
                      break

          valid = []
          seen = set()

          for course in courses:
              if not isinstance(course, dict):
                  continue

              ident = course.get("id")
              depart = course.get("depart")
              partants = course.get("partants")

              if not ident or not depart:
                  continue

              if not isinstance(partants, list):
                  continue

              if not partants:
                  continue

              if (
                  course.get(
                      "localisation_france_verifiee"
                  ) is not True
              ):
                  continue

              if str(ident) in seen:
                  continue

              seen.add(str(ident))
              valid.append(course)

          status = (
              "OK"
              if collecte_ok and valid
              else "DEGRADE"
          )

          if not valid:
              errors.append(
                  "Aucune course francaise "
                  "verifiee exploitable."
              )

          diagnostic = {
              "version": "2.0",
              "date": now.date().isoformat(),
              "mis_a_jour": now.isoformat(),
              "statut": status,
              "collecte_executee": collecte_ok,
              "source_courses": (
                  str(source_path.relative_to(ROOT))
                  if source_path
                  else None
              ),
              "courses_verifiees": len(valid),
              "erreurs": errors,
              "note": (
                  "Aucun pronostic, FIGE ou "
                  "resultat officiel invente."
              )
          }

          atomic(
              DATA / "diagnostic_unifie.json",
              diagnostic
          )

          if collecte_ok and valid:
              atomic(
                  DATA / "courses_verifiees.json",
                  {
                      "date": now.date().isoformat(),
                      "mis_a_jour": now.isoformat(),
                      "statut": status,
                      "courses": valid
                  }
              )

          print("=" * 50)
          print("X1000 PHOENIX - COLLECTE UNIFIEE")
          print("=" * 50)
          print("Statut :", status)
          print("Date :", now.isoformat())
          print("Courses verifiees :", len(valid))
          print("Source :", source_path)
          print("=" * 50)

          for error in errors:
              print("DIAGNOSTIC:", error)
          PY

      - name: Publier les donnees sur main
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Publier uniquement les fichiers attendus.
          # Les FIGES historiques restent inchanges.
          git add -f -- data/diagnostic_unifie.json

          if [ -f data/courses_verifiees.json ]; then
            git add -f -- data/courses_verifiees.json
          fi

          if git diff --cached --quiet; then
            echo "Aucune modification a publier"
            exit 0
          fi

          git commit \
            -m "X1000: actualisation PMU verifiee"

          # Conserver le commit de publication.
          # Mettre temporairement de cote les
          # autres modifications non commitees.
          if [ -n "$(git status --porcelain)" ]; then
            git stash push \
              --include-untracked \
              -m "X1000 modifications temporaires"
          fi

          # Ne jamais forcer la branche main.
          # En cas de conflit, arreter proprement.
          for i in 1 2 3 4 5; do

            echo "Tentative de publication $i"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Conflit Git detecte"
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Publication X1000 reussie"
              exit 0
            fi

            echo "Nouvelle tentative dans quelques secondes"
            sleep $((i * 3))
          done

          echo "::error::Publication impossible"
          exit 1

      - name: Rapport final
        if: always()
        run: |
          echo "=================================="
          echo "X1000 PHOENIX - RAPPORT FINAL"
          echo "=================================="
          echo "Date Paris : $(TZ=Europe/Paris date)"
          echo "Depot : $GITHUB_REPOSITORY"
          echo "Branche : main"
          echo "Execution : $GITHUB_RUN_ID"
          echo "=================================="
