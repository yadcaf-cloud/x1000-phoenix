
name: X1000 PHOENIX - INTELLIGENCE M1-M5

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: x1000-phoenix
  cancel-in-progress: false

jobs:
  phoenix:
    name: Intelligence hippique M1-M5
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Europe/Paris
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      # 1 - RECUPERATION DU DEPOT

      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 2 - INSTALLATION PYTHON

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3 - VERIFICATION DES PROGRAMMES

      - name: Verifier les programmes
        run: |
          set -euo pipefail
          python --version

          for fichier in \
            phoenix.py \
            pmu_engine.py \
            analyser_moteurs.py \
            publication.py \
            reparer_figes_audits.py
          do
            if [ ! -f "$fichier" ]; then
              echo "::error::Fichier absent: $fichier"
              exit 1
            fi

            python -m py_compile "$fichier"
          done

          echo "Programmes Python valides"

      # 4 - PREPARATION DES DOSSIERS

      - name: Preparer les dossiers
        run: |
          set -euo pipefail

          mkdir -p data/figes
          mkdir -p data/audits
          mkdir -p data/pv
          mkdir -p data/journaux

      # 5 - SAUVEGARDE DES HISTORIQUES

      - name: Sauvegarder les FIGES historiques
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = Path("data")
          sauvegarde = Path("/tmp/phoenix-historique")
          sauvegarde.mkdir(parents=True, exist_ok=True)

          inventaire = {}

          for path in sorted(base.rglob("*.json")):
              relatif = path.relative_to(base)
              parties = [p.lower() for p in relatif.parts]
              nom = path.name.lower()

              protege = (
                  any(
                      p in ("figes", "pv", "audits", "journaux")
                      for p in parties
                  )
                  or "fige" in nom
                  or "audit" in nom
                  or nom.startswith("pv")
              )

              if not protege:
                  continue

              contenu = path.read_bytes()
              empreinte = hashlib.sha256(
                  contenu
              ).hexdigest()

              inventaire[str(relatif)] = empreinte

              destination = sauvegarde / relatif
              destination.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )
              destination.write_bytes(contenu)

          (sauvegarde / "inventaire.json").write_text(
              json.dumps(
                  inventaire,
                  indent=2,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          print(
              "Historiques sauvegardes:",
              len(inventaire)
          )
          PY

      # 6 - COLLECTE PMU

      - name: Collecter les courses PMU
        id: collecte
        run: |
          set -euo pipefail

          echo "Debut collecte PMU"
          python pmu_engine.py
          echo "Collecte terminee"

      # 7 - ANALYSES INDEPENDANTES M1-M5

      - name: Analyser les courses M1-M5
        id: analyses
        run: |
          set -euo pipefail

          echo "Debut analyses M1-M5"
          python analyser_moteurs.py
          echo "Analyses terminees"

      # 8 - FIGES ET AUDITS

      - name: Verifier FIGES et audits
        id: audits
        run: |
          set -euo pipefail

          echo "Verification des FIGES"
          python reparer_figes_audits.py
          echo "Verification terminee"

      # 9 - PROTECTION DES HISTORIQUES

      - name: Proteger les FIGES historiques
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = Path("data")
          sauvegarde = Path("/tmp/phoenix-historique")

          inventaire = json.loads(
              (sauvegarde / "inventaire.json")
              .read_text(encoding="utf-8")
          )

          erreurs = []

          for relatif, empreinte in inventaire.items():
              actuel = base / relatif

              if not actuel.exists():
                  erreurs.append(
                      f"Historique supprime: {relatif}"
                  )
                  continue

              nouvelle_empreinte = hashlib.sha256(
                  actuel.read_bytes()
              ).hexdigest()

              if nouvelle_empreinte != empreinte:
                  erreurs.append(
                      f"Historique modifie: {relatif}"
                  )

          if erreurs:
              for erreur in erreurs:
                  print("::error::" + erreur)

              raise SystemExit(
                  "Protection historique echouee. "
                  "Publication interrompue."
              )

          print(
              "Protection historique validee:",
              len(inventaire)
          )
          PY

      # 10 - PUBLICATION DES RAPPORTS

      - name: Generer les publications
        id: publications
        run: |
          set -euo pipefail

          python publication.py

          echo "Publications generees"

      # 11 - VALIDATION DES FICHIERS JSON

      - name: Verifier tous les JSON
        id: json
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          base = Path("data")

          if not base.is_dir():
              raise SystemExit(
                  "Dossier data absent"
              )

          fichiers = sorted(base.rglob("*.json"))

          if not fichiers:
              raise SystemExit(
                  "Aucun fichier JSON disponible"
              )

          erreurs = []

          for path in fichiers:
              try:
                  with path.open(
                      encoding="utf-8"
                  ) as f:
                      json.load(f)

                  print("JSON valide:", path)

              except (
                  OSError,
                  ValueError,
                  UnicodeError
              ) as exc:
                  erreurs.append(
                      f"{path}: {exc}"
                  )

          if erreurs:
              for erreur in erreurs:
                  print("::error::" + erreur)

              raise SystemExit(
                  "Validation JSON echouee"
              )

          print(
              "Nombre de JSON valides:",
              len(fichiers)
          )
          PY

      # 12 - CONTROLE DES PUBLICATIONS

      - name: Diagnostiquer les publications
        id: diagnostic
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          base = Path("data")

          obligatoires = (
              "publication_courses.json",
              "publication_pv.json",
              "publication_figes.json",
              "publication_audits.json",
              "publication_rapport.json",
          )

          absents = []

          for nom in obligatoires:
              path = base / nom

              if not path.is_file():
                  absents.append(nom)
                  print(
                      "::error::Publication absente:",
                      nom
                  )
                  continue

              with path.open(
                  encoding="utf-8"
              ) as f:
                  json.load(f)

              print("Publication valide:", nom)

          if absents:
              raise SystemExit(
                  "Publications manquantes: "
                  + ", ".join(absents)
              )

          rapport_path = (
              base / "publication_rapport.json"
          )

          rapport = json.loads(
              rapport_path.read_text(
                  encoding="utf-8"
              )
          )

          if not isinstance(rapport, dict):
              raise SystemExit(
                  "Rapport de publication invalide"
              )

          print(
              "Statut:",
              rapport.get("status", "INCONNU")
          )

          for cle in (
              "courses_collectees",
              "courses_count",
              "analyses_count",
              "pronostics_count",
              "pv_count",
              "figes_count",
              "audits_count",
          ):
              print(
                  cle,
                  rapport.get(
                      cle,
                      "NON RENSEIGNE"
                  )
              )

          difficultes = rapport.get(
              "difficultes",
              []
          )

          if difficultes:
              print(
                  "::warning::Difficultes signalees"
              )
              print(
                  json.dumps(
                      difficultes,
                      ensure_ascii=False,
                      indent=2
                  )
              )

          print("Diagnostic termine")
          PY

      # 13 - ENREGISTREMENT GITHUB

      - name: Publier les donnees sur GitHub
        id: github
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/

          if git diff --cached --quiet; then
            echo "Aucune modification a publier"
            exit 0
          fi

          git commit -m \
            "PHOENIX: actualisation M1-M5"

          for i in 1 2 3; do
            echo "Tentative publication $i"

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Publication reussie"
                exit 0
              fi
            fi

            git rebase --abort || true
            sleep 5
          done

          echo "::error::Publication GitHub echouee"
          exit 1

      # 14 - BILAN FINAL

      - name: Bilan X1000 PHOENIX
        if: always()
        env:
          COLLECTE_RESULT: ${{ steps.collecte.outcome }}
          ANALYSES_RESULT: ${{ steps.analyses.outcome }}
          AUDITS_RESULT: ${{ steps.audits.outcome }}
          PUBLICATIONS_RESULT: ${{ steps.publications.outcome }}
          JSON_RESULT: ${{ steps.json.outcome }}
          DIAGNOSTIC_RESULT: ${{ steps.diagnostic.outcome }}
          GITHUB_RESULT: ${{ steps.github.outcome }}
        run: |
          {
            echo "## X1000 PHOENIX - BILAN"
            echo ""
            echo "| Etape | Resultat |"
            echo "|---|---|"
            echo "| Collecte PMU | $COLLECTE_RESULT |"
            echo "| Analyses M1-M5 | $ANALYSES_RESULT |"
            echo "| FIGES et audits | $AUDITS_RESULT |"
            echo "| Publications | $PUBLICATIONS_RESULT |"
            echo "| Validation JSON | $JSON_RESULT |"
            echo "| Diagnostic | $DIAGNOSTIC_RESULT |"
            echo "| GitHub | $GITHUB_RESULT |"
            echo ""
            echo "Heure Paris : $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M:%S')"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "X1000 PHOENIX - FIN DU PASSAGE"
