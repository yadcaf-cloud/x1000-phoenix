name: X1000 PHOENIX - M1 M5

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: x1000-phoenix
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier les programmes
        run: |
          python -m py_compile phoenix.py
          python -m py_compile publication.py

      - name: Executer les moteurs et publier
        run: |
          python publication.py

      - name: Verifier les fichiers JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("data").rglob("*.json"):
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print("OK:", path)
          PY

      - name: Enregistrer les rapports
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/

          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git commit -m "PHOENIX: actualisation des rapports"

          for tentative in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Publication reussie."
                exit 0
              fi
            fi

            git rebase --abort || true
            sleep 3
          done

          echo "Publication impossible."
          exit 1
