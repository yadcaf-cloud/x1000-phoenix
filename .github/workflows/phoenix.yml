name: X1000 PHOENIX - M1 M5

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: x1000-phoenix
  cancel-in-progress: false

jobs:
  phoenix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier Python
        run: |
          python -m py_compile phoenix.py
          python -m py_compile pmu_engine.py
          python -m py_compile publication.py
          python pmu_engine.py --self-test

      - name: Collecter les courses PMU
        id: collecte
        continue-on-error: true
        run: python pmu_engine.py

      - name: Produire les analyses et FIGES
        run: python publication.py

      - name: Verifier les fichiers JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("data").rglob("*.json"):
              with path.open(encoding="utf-8") as f:
                  json.load(f)
              print("OK:", path)
          PY

      - name: Publier les donnees
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/

          if git diff --cached --quiet; then
            echo "Aucune modification"
            exit 0
          fi

          git commit -m "PHOENIX: publication M1-M5"

          for i in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Publication reussie"
                exit 0
              fi
            fi

            git rebase --abort || true
            sleep 5
          done

          exit 1
