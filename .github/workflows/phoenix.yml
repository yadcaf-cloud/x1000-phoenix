name: X1000 PHOENIX - M1 M5

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: x1000-phoenix
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier le code Python
        run: |
          python -m py_compile phoenix.py
          python -m py_compile publication.py

      - name: Analyser et publier
        run: |
          python publication.py

      - name: Enregistrer les rapports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest.json

          if ! git diff --cached --quiet; then
            git commit -m "PHOENIX: actualisation des analyses"
            git push
          else
            echo "Aucune modification"
          fi
          
