name: X1000 PHOENIX - INTELLIGENCE M1-M5

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: x1000-phoenix
  cancel-in-progress: false

jobs:
  phoenix:
    name: Intelligence hippique M1-M5
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Europe/Paris
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    defaults:
      run:
        shell: bash

    steps:

      # 1. RECUPERATION DU DEPOT

      - name: Recuperer le depot
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      # 2. INSTALLATION PYTHON

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 3. DEPENDANCES

      - name: Installer les dependances
        run: |
          set -euo pipefail
          python --version

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      # 4. VERIFICATION DES PROGRAMMES

      - name: Verifier les programmes
        run: |
          set -euo pipefail

          for fichier in \
            phoenix.py \
            pmu_engine.py \
            analyser_moteurs.py \
            reparer_figes_audits.py \
            publication.py
          do
            if [ ! -f "$fichier" ]; then
              echo "::error::Fichier absent: $fichier"
              exit 1
            fi

            python -m py_compile "$fichier"
          done

          echo "Programmes Python valides"

      # 5. PREPARATION DES DOSSIERS

      - name: Preparer les dossiers
        run: |
          set -euo pipefail

          mkdir -p data/figes
          mkdir -p data/pv
          mkdir -p data/audits
          mkdir -p data/journaux

          echo "Dossiers disponibles"

      # 6. INVENTAIRE DES ARCHIVES

      - name: Sauvegarder les historiques
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = Path("data")
          backup = Path("/tmp/x1000-protection")
          backup.mkdir(parents=True, exist_ok=True)

          dossiers = {
              "figes",
              "pv",
              "audits",
              "journaux",
          }

          inventaire = {}

          for path in sorted(base.rglob("*.json")):
              relatif = path.relative_to(base)

              if path.name.lower().startswith(
                  "publication_"
              ):
                  continue

              parties = {
                  p.lower()
                  for p in relatif.parts[:-1]
              }

              if not parties.intersection(dossiers):
                  continue

              contenu = path.read_bytes()

              inventaire[str(relatif)] = (
                  hashlib.sha256(contenu).hexdigest()
              )

          (backup / "inventaire.json").write_text(
              json.dumps(
                  inventaire,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              "Archives historiques protegees:",
              len(inventaire)
          )
          PY

      # 7. COLLECTE PMU

      - name: Collecter les courses PMU
        id: collecte
        run: |
          set -euo pipefail

          echo "Debut collecte PMU"
          python pmu_engine.py
          echo "Collecte terminee"

      # 8. ANALYSES M1-M5

      - name: Analyser les courses M1-M5
        id: analyses
        run: |
          set -euo pipefail

          echo "Debut analyses M1-M5"
          python analyser_moteurs.py
          echo "Analyses terminees"

      # 9. FIGES PV ET AUDITS

      - name: Verifier FIGES PV et audits
        id: audits
        run: |
          set -euo pipefail

          python reparer_figes_audits.py

          echo "Verification terminee"

      # 10. PROTECTION DES HISTORIQUES

      - name: Proteger les FIGES historiques
        id: protection
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = Path("data")
          inventaire = json.loads(
              Path(
                  "/tmp/x1000-protection/inventaire.json"
              ).read_text(encoding="utf-8")
          )

          erreurs = []

          for relatif, empreinte in inventaire.items():
              fichier = base / relatif

              if not fichier.is_file():
                  erreurs.append(
                      "Archive supprimee: " + relatif
                  )
                  continue

              actuelle = hashlib.sha256(
                  fichier.read_bytes()
              ).hexdigest()

              if actuelle != empreinte:
                  erreurs.append(
                      "Archive modifiee: " + relatif
                  )

          if erreurs:
              for erreur in erreurs:
                  print("::error::" + erreur)

              raise SystemExit(
                  "Protection historique echouee"
              )

          print(
              "Archives historiques preservees:",
              len(inventaire)
          )
          print("Nouveaux FIGES autorises")
          print("Publications regenerables autorisees")
          PY

      # 11. GENERATION DES PUBLICATIONS

      - name: Generer les publications
        id: publications
        run: |
          set -euo pipefail

          python publication.py

          echo "Publications generees"

      # 12. VALIDATION JSON

      - name: Verifier tous les JSON
        id: json
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          base = Path("data")
          fichiers = sorted(base.rglob("*.json"))

          if not fichiers:
              raise SystemExit(
                  "Aucun fichier JSON disponible"
              )

          erreurs = []

          for fichier in fichiers:
              try:
                  with fichier.open(
                      encoding="utf-8"
                  ) as f:
                      json.load(f)

                  print("JSON valide:", fichier)

              except (
                  OSError,
                  ValueError,
                  UnicodeError
              ) as exc:
                  erreurs.append(
                      f"{fichier}: {exc}"
                  )

          if erreurs:
              for erreur in erreurs:
                  print("::error::" + erreur)

              raise SystemExit(
                  "Validation JSON echouee"
              )

          print(
              "Nombre de JSON valides:",
              len(fichiers)
          )
          PY

      # 13. DIAGNOSTIC DES PUBLICATIONS

      - name: Diagnostiquer les publications
        id: diagnostic
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          base = Path("data")

          obligatoires = (
              "publication_courses.json",
              "publication_pv.json",
              "publication_figes.json",
              "publication_audits.json",
              "publication_rapport.json",
          )

          for nom in obligatoires:
              fichier = base / nom

              if not fichier.is_file():
                  raise SystemExit(
                      "Publication absente: " + nom
                  )

              with fichier.open(
                  encoding="utf-8"
              ) as f:
                  json.load(f)

              print("Publication valide:", nom)

          rapport = json.loads(
              (
                  base / "publication_rapport.json"
              ).read_text(encoding="utf-8")
          )

          if not isinstance(rapport, dict):
              raise SystemExit(
                  "Rapport invalide"
              )

          print(
              "Statut:",
              rapport.get("status", "INCONNU")
          )

          for cle in (
              "courses_collectees",
              "courses_count",
              "analyses_count",
              "pronostics_count",
              "pv_count",
              "figes_count",
              "audits_count",
          ):
              print(
                  cle,
                  rapport.get(
                      cle,
                      "NON RENSEIGNE"
                  )
              )

          difficultes = rapport.get(
              "difficultes", []
          )

          if difficultes:
              print(
                  "::warning::Difficultes signalees"
              )
              print(
                  json.dumps(
                      difficultes,
                      ensure_ascii=False,
                      indent=2
                  )
              )

          print("Diagnostic termine")
          PY

      # 14. CONTROLE FINAL DES ARCHIVES

      - name: Controle final des archives
        id: final_protection
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = Path("data")

          inventaire = json.loads(
              Path(
                  "/tmp/x1000-protection/inventaire.json"
              ).read_text(encoding="utf-8")
          )

          for relatif, empreinte in inventaire.items():
              fichier = base / relatif

              if not fichier.is_file():
                  raise SystemExit(
                      "Archive manquante: " + relatif
                  )

              actuelle = hashlib.sha256(
                  fichier.read_bytes()
              ).hexdigest()

              if actuelle != empreinte:
                  raise SystemExit(
                      "Archive alteree: " + relatif
                  )

          print("Integrite historique confirmee")
          PY

      # 15. PUBLICATION GITHUB

      - name: Publier les donnees sur GitHub
        id: github
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/

          if git diff --cached --quiet; then
            echo "Aucune modification a publier"
            exit 0
          fi

          git commit -m \
            "PHOENIX: actualisation M1-M5"

          for tentative in 1 2 3; do
            echo "Tentative $tentative"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Conflit Git detecte"
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Publication reussie"
              exit 0
            fi

            sleep 5
          done

          echo "::error::Publication GitHub echouee"
          exit 1

      # 16. BILAN FINAL

      - name: Bilan X1000 PHOENIX
        if: always()
        env:
          COLLECTE: ${{ steps.collecte.outcome }}
          ANALYSES: ${{ steps.analyses.outcome }}
          AUDITS: ${{ steps.audits.outcome }}
          PROTECTION: ${{ steps.protection.outcome }}
          PUBLICATIONS: ${{ steps.publications.outcome }}
          JSON_RESULT: ${{ steps.json.outcome }}
          DIAGNOSTIC: ${{ steps.diagnostic.outcome }}
          FINAL_PROTECTION: ${{ steps.final_protection.outcome }}
          GITHUB_RESULT: ${{ steps.github.outcome }}
        run: |
          {
            echo "## X1000 PHOENIX - BILAN"
            echo ""
            echo "| Etape | Resultat |"
            echo "|---|---|"
            echo "| Collecte PMU | $COLLECTE |"
            echo "| Analyses M1-M5 | $ANALYSES |"
            echo "| FIGES PV et audits | $AUDITS |"
            echo "| Protection historique | $PROTECTION |"
            echo "| Publications | $PUBLICATIONS |"
            echo "| Validation JSON | $JSON_RESULT |"
            echo "| Diagnostic | $DIAGNOSTIC |"
            echo "| Controle final | $FINAL_PROTECTION |"
            echo "| Publication GitHub | $GITHUB_RESULT |"
            echo ""
            echo "Heure Paris : $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M:%S')"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "X1000 PHOENIX - FIN DU PASSAGE"
