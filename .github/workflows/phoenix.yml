name: X1000 PHOENIX - AUTOMATISATION M1 M5

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: x1000-phoenix-production
  cancel-in-progress: false

jobs:
  phoenix:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier la syntaxe
        run: |
          python -m py_compile phoenix.py
          python -m py_compile publication.py
          python -m py_compile pmu_engine.py

      - name: Collecter les donnees PMU
        id: collecte
        continue-on-error: true
        run: |
          python pmu_engine.py

      - name: Publier les donnees
        run: |
          python publication.py

      - name: Verifier les JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for chemin in Path("data").rglob("*.json"):
              with chemin.open(encoding="utf-8") as f:
                  json.load(f)
              print("OK:", chemin)
          PY

      - name: Enregistrer les rapports
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/

          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git commit -m "PHOENIX: publication M1-M5"

          for tentative in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Publication reussie."
                exit 0
              fi
            fi

            git rebase --abort || true
            sleep 5
          done

          echo "Echec de publication."
          exit 1

      - name: Signaler un echec de collecte
        if: steps.collecte.outcome == 'failure'
        run: |
          echo "::warning::Collecte PMU en echec."
          echo "Verifier les donnees et le journal."
