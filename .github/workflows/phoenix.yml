name: X1000 PHOENIX - INTELLIGENCE M1-M5

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: x1000-phoenix
  cancel-in-progress: false

jobs:
  phoenix:
    name: Intelligence hippique M1-M5
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Europe/Paris
      PYTHONUNBUFFERED: "1"

    steps:

      # 1 - RECUPERATION

      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 2 - PYTHON

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3 - VERIFICATION DU LOGICIEL

      - name: Verifier les programmes
        run: |
          set -euo pipefail

          python --version

          for fichier in \
            phoenix.py \
            pmu_engine.py \
            analyser_moteurs.py \
            publication.py \
            reparer_figes_audits.py
          do
            if [ ! -f "$fichier" ]; then
              echo "::error::Fichier absent: $fichier"
              exit 1
            fi

            python -m py_compile "$fichier"
          done

          echo "Programmes Python valides"

      # 4 - TEST PMU

      - name: Tester le moteur PMU
        id: test_pmu
        run: |
          set -euo pipefail
          python pmu_engine.py --self-test

      # 5 - SAUVEGARDE DES FIGES

      - name: Sauvegarder les FIGES historiques
        run: |
          set -euo pipefail

          mkdir -p /tmp/phoenix-historique

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = Path("data")
          sauvegarde = Path("/tmp/phoenix-historique")
          inventaire = {}

          for path in sorted(base.rglob("*.json")):
              relatif = path.relative_to(base)

              if (
                  "fige" in path.name.lower()
                  or "figes" in path.parts
                  or "journaux" in path.parts
                  or "pv" in path.name.lower()
                  or "audit" in path.name.lower()
              ):
                  contenu = path.read_bytes()
                  inventaire[str(relatif)] = (
                      hashlib.sha256(contenu).hexdigest()
                  )

                  destination = sauvegarde / relatif
                  destination.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )
                  destination.write_bytes(contenu)

          (sauvegarde / "inventaire.json").write_text(
              json.dumps(inventaire, indent=2),
              encoding="utf-8"
          )

          print(
              "Fichiers historiques sauvegardes:",
              len(inventaire)
          )
          PY

      # 6 - COLLECTE PMU

      - name: Collecter les courses PMU
        id: collecte
        run: |
          set -euo pipefail

          echo "Debut collecte PMU"
          python pmu_engine.py
          echo "Collecte terminee"

      # 7 - ANALYSES M1-M5

      - name: Produire les analyses M1-M5
        id: analyses
        if: steps.collecte.outcome == 'success'
        run: |
          set -euo pipefail

          echo "Analyses X1000 PHOENIX"
          python publication.py
          echo "Analyses terminees"

      # 8 - PROTECTION HISTORIQUE

      - name: Controler les FIGES historiques
        if: steps.analyses.outcome == 'success'
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = Path("data")
          sauvegarde = Path("/tmp/phoenix-historique")

          inventaire = json.loads(
              (sauvegarde / "inventaire.json")
              .read_text(encoding="utf-8")
          )

          for relatif, empreinte in inventaire.items():
              actuel = base / relatif
              original = sauvegarde / relatif

              if not actuel.exists():
                  actuel.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )
                  actuel.write_bytes(
                      original.read_bytes()
                  )
                  print("Historique restaure:", relatif)
                  continue

              if hashlib.sha256(
                  actuel.read_bytes()
              ).hexdigest() != empreinte:

                  actuel.write_bytes(
                      original.read_bytes()
                  )

                  print(
                      "::warning::Historique modifie "
                      "et restaure:", relatif
                  )

          print("Protection historique terminee")
          PY

      # 9 - VALIDATION JSON

      - name: Verifier les fichiers JSON
        id: json
        if: steps.analyses.outcome == 'success'
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          base = Path("data")

          if not base.is_dir():
              raise SystemExit(
                  "Dossier data absent"
              )

          fichiers = sorted(base.rglob("*.json"))

          if not fichiers:
              raise SystemExit(
                  "Aucun fichier JSON"
              )

          erreurs = []

          for path in fichiers:
              try:
                  with path.open(
                      encoding="utf-8"
                  ) as f:
                      json.load(f)

                  print("OK:", path)

              except (
                  OSError,
                  ValueError,
                  UnicodeError
              ) as exc:
                  erreurs.append(
                      f"{path}: {exc}"
                  )

          if erreurs:
              for erreur in erreurs:
                  print("ERREUR:", erreur)

              raise SystemExit(
                  "Validation JSON echouee"
              )

          print(
              f"{len(fichiers)} fichiers JSON valides"
          )
          PY

      # 10 - DIAGNOSTIC DES PUBLICATIONS

      - name: Diagnostiquer les publications
        id: diagnostic
        if: steps.json.outcome == 'success'
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          base = Path("data")

          obligatoires = (
              "publication_courses.json",
              "publication_figes.json",
              "publication_audits.json",
              "publication_rapport.json",
          )

          absents = []

          for nom in obligatoires:
              path = base / nom

              if not path.exists():
                  absents.append(nom)
                  print(
                      "::warning::Fichier absent:",
                      nom
                  )
                  continue

              with path.open(
                  encoding="utf-8"
              ) as f:
                  document = json.load(f)

              print("Publication valide:", nom)

          if absents:
              raise SystemExit(
                  "Publications obligatoires absentes: "
                  + ", ".join(absents)
              )

          rapport = json.loads(
              (base / "publication_rapport.json")
              .read_text(encoding="utf-8")
          )

          if not isinstance(rapport, dict):
              raise SystemExit(
                  "Rapport PMU invalide"
              )

          print(
              "Statut:",
              rapport.get("status", "INCONNU")
          )

          for cle in (
              "courses_collectees",
              "courses_count",
              "analyses_count",
              "pronostics_count",
              "pv_count",
              "figes_count",
              "audits_count",
          ):
              print(
                  cle,
                  rapport.get(cle, "NON RENSEIGNE")
              )

          if rapport.get("difficultes"):
              print(
                  "::warning::Difficultes detectees"
              )

          print("Diagnostic termine")
          PY

      # 11 - PUBLICATION GITHUB

      - name: Publier les donnees
        id: github
        if: steps.diagnostic.outcome == 'success'
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/

          if git diff --cached --quiet; then
            echo "Aucune nouvelle modification"
            exit 0
          fi

          git commit -m \
            "PHOENIX: actualisation M1-M5"

          for i in 1 2 3; do
            echo "Publication tentative $i"

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Publication reussie"
                exit 0
              fi
            fi

            git rebase --abort || true

            sleep 5
          done

          echo "::error::Echec publication"
          exit 1

      # 12 - BILAN FINAL

      - name: Bilan X1000 PHOENIX
        if: always()
        env:
          TEST_RESULT: ${{ steps.test_pmu.outcome }}
          COLLECTE_RESULT: ${{ steps.collecte.outcome }}
          ANALYSES_RESULT: ${{ steps.analyses.outcome }}
          JSON_RESULT: ${{ steps.json.outcome }}
          DIAGNOSTIC_RESULT: ${{ steps.diagnostic.outcome }}
          GITHUB_RESULT: ${{ steps.github.outcome }}
        run: |
          echo "================================"
          echo "X1000 PHOENIX - BILAN FINAL"
          echo "================================"

          echo "Test PMU: $TEST_RESULT"
          echo "Collecte: $COLLECTE_RESULT"
          echo "Analyses: $ANALYSES_RESULT"
          echo "JSON: $JSON_RESULT"
          echo "Diagnostic: $DIAGNOSTIC_RESULT"
          echo "GitHub: $GITHUB_RESULT"

          echo "Heure de Paris:"
          TZ=Europe/Paris date \
            '+%d/%m/%Y %H:%M:%S'

          if [ "$COLLECTE_RESULT" != "success" ]; then
            echo "::warning::Collecte PMU echouee"
          fi

          if [ "$ANALYSES_RESULT" != "success" ]; then
            echo "::warning::Analyses non terminees"
          fi

          if [ "$GITHUB_RESULT" != "success" ]; then
            echo "::warning::Publication non confirmee"
          fi

          echo "Fin du passage X1000 PHOENIX"
